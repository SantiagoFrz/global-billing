name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: global_billing
          POSTGRES_USER: global_billing
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U global_billing" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: global_billing
      POSTGRES_USER: global_billing
      POSTGRES_PASSWORD: test-password
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-use
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest backend

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
