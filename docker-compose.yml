name: global-billing

x-backend: &backend
  build: ./backend
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media_data:/app/media
  restart: unless-stopped
  logging:
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: backend", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery-worker:
    <<: *backend
    command: celery -A config worker -l INFO --concurrency=2

  celery-beat:
    <<: *backend
    command: celery -A config beat -l INFO --schedule=/tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  backup:
    build: ./scripts/backup
    profiles: ["backup"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - media_data:/data/media:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/scripts/backup/run.sh"]

  restore:
    build: ./scripts/backup
    profiles: ["restore"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - media_data:/data/media
      - backup_data:/backups:ro
    entrypoint: ["/bin/sh", "/scripts/restore/run.sh"]

volumes:
  postgres_data:
  redis_data:
  media_data:
  backup_data:
